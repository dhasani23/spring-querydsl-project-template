/**
 * QueryDSL plugin for Java 17
 */
class QueryDslPlugin implements Plugin<Project> {

    void apply(Project project) {
        def generatedDir = "${project.buildDir}/generated/sources/annotationProcessor/java/main"
        
        project.task('generateQueryDSL', type: JavaCompile) {
            doFirst {
                project.delete(generatedDir)
                project.file(generatedDir).mkdirs()
            }
            
            source = project.sourceSets.main.java
            classpath = project.configurations.compileClasspath
            options.annotationProcessorPath = project.configurations.annotationProcessor
            options.compilerArgs = [
                "-proc:only", 
                "-processor", "com.querydsl.apt.jpa.JPAAnnotationProcessor",
                "-Aquerydsl.entityAccessors=true",
                "-s", generatedDir
            ]
            destinationDirectory = project.file(generatedDir)
        }
        
        project.sourceSets {
            main {
                java {
                    srcDirs += [generatedDir]
                }
            }
        }
        
        project.compileJava.dependsOn('generateQueryDSL')
    }
}

apply plugin: QueryDslPlugin