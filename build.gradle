plugins {
	id 'java'
	id 'checkstyle'
	id 'org.springframework.boot' version '2.7.18'
	id 'io.spring.dependency-management' version '1.1.6'
	id 'com.github.kt3k.coveralls' version '2.12.2'
}

hasProperty('disableIntegrationTests') && (ext.disableJacoco = true)

apply from: 'gradle/plugins/queryDsl.gradle'
apply from: 'gradle/plugins/codeCoverage.gradle'

group = 'com.softeq'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

def swaggerVersion = '2.8.0'
def mapstructVersion = '1.6.3'
def lombokVersion = '1.18.36'
def junitVersion = '5.10.2'
def mockitoVersion = '5.14.2'
def querydslVersion = '5.0.0'

ext['junit-jupiter.version'] = junitVersion
ext['mockito.version'] = mockitoVersion
ext['byte-buddy.version'] = '1.15.11'

repositories {
	mavenCentral()
}

sourceSets {
	itest {
		compileClasspath += sourceSets.main.output
		runtimeClasspath += sourceSets.main.output
	}
}

configurations {
	itestImplementation.extendsFrom testImplementation
	itestRuntimeOnly.extendsFrom testRuntimeOnly
	itestAnnotationProcessor.extendsFrom testAnnotationProcessor
}

test {
	useJUnitPlatform()
}

tasks.register('integrationTest', Test) {
	description = 'Runs integration tests.'
	group = 'verification'
	testClassesDirs = sourceSets.itest.output.classesDirs
	classpath = sourceSets.itest.runtimeClasspath
	useJUnitPlatform()
	shouldRunAfter tasks.named('test')
}

tasks.named('check') {
	dependsOn tasks.named('integrationTest')
}

coveralls {
	jacocoReportPath 'build/reports/jacoco/test/jacocoTestReport.xml'
}

checkstyle {
	toolVersion '10.20.1'
	configFile file('gradle/checkstyle/oracle_checks.xml')
}

dependencies {
	annotationProcessor "org.projectlombok:lombok:$lombokVersion"
	compileOnly "org.projectlombok:lombok:$lombokVersion"

	annotationProcessor "org.mapstruct:mapstruct-processor:$mapstructVersion"
	implementation "org.mapstruct:mapstruct:$mapstructVersion"

	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

	annotationProcessor(
		"com.querydsl:querydsl-apt:$querydslVersion:jpa",
		'org.hibernate.javax.persistence:hibernate-jpa-2.1-api:1.0.2.Final',
		'javax.annotation:javax.annotation-api:1.3.2'
	)
	implementation "com.querydsl:querydsl-core:$querydslVersion"
	implementation "com.querydsl:querydsl-jpa:$querydslVersion"

	runtimeOnly 'org.postgresql:postgresql'
	implementation 'org.liquibase:liquibase-core'

	implementation "io.springfox:springfox-swagger2:$swaggerVersion"
	implementation "io.springfox:springfox-swagger-ui:$swaggerVersion"

	testImplementation "org.mockito:mockito-core:$mockitoVersion"
	testImplementation "org.mockito:mockito-junit-jupiter:$mockitoVersion"
	testImplementation "org.junit.jupiter:junit-jupiter-api:$junitVersion"
	testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:$junitVersion"

	itestImplementation 'org.springframework.boot:spring-boot-starter-test'
	itestImplementation "org.junit.jupiter:junit-jupiter-api:$junitVersion"
	itestRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:$junitVersion"
	itestRuntimeOnly 'com.h2database:h2:2.2.224'
}
